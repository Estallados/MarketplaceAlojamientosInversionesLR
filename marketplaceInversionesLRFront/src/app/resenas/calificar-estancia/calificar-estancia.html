<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="resena-titulo">
  <div class="modal-panel max-w-md">
    <div class="flex justify-between">
      <div>
        <h2 id="resena-titulo" class="font-display text-3xl font-semibold">Calificar estancia</h2>
        <p class="mt-3 text-sm leading-6 text-ink-500">
          Califica tu estancia en {{ tituloAlojamiento() || 'este alojamiento' }}.
        </p>
      </div>
      <button type="button" (click)="cancelar()" aria-label="Cerrar" class="grid size-9 shrink-0 place-items-center rounded-md text-ink-500 transition-colors hover:bg-ink-100 hover:text-ink-900">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mt-6">
      <span class="mb-2 block text-sm font-bold">Calificación <span class="text-red-500">*</span></span>
      <div class="flex items-center gap-1" role="radiogroup" aria-label="Calificación de 1 a 5 estrellas" (mouseleave)="calificacionHover.set(0)">
        @for (s of starList; track s) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="calificacion() === s"
            [attr.aria-label]="s + (s === 1 ? ' estrella' : ' estrellas')"
            (click)="elegirCalificacion(s)"
            (mouseenter)="calificacionHover.set(s)"
            class="rounded p-1 transition-transform"
          >
            <svg
              class="size-8"
              [class.text-gold-500]="s <= (calificacionHover() || calificacion())"
              [class.text-ink-200]="s > (calificacionHover() || calificacion())"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="m12 2 3 6 7 .9-5 4.8 1.4 6.8L12 17.3l-6.4 3.2L7 13.7 2 8.9 9 8Z" />
            </svg>
          </button>
        }
      </div>
    </div>

    <label class="mt-5 block">
      <span class="mb-2 block text-sm font-bold">Comentario <span class="font-normal text-ink-500">(opcional)</span></span>
      <textarea
        [value]="comentario()"
        (input)="comentario.set($any($event.target).value)"
        [attr.maxlength]="MAX_COMENTARIO"
        rows="4"
        placeholder="¿Qué te gustó? ¿Qué podría mejorar?"
        class="field"
      ></textarea>
      <span class="mt-1 block text-right text-xs text-ink-500">{{ comentario().length }}/{{ MAX_COMENTARIO }}</span>
    </label>

    @if (error()) {
      <p class="mt-3 rounded-md bg-red-50 p-3 text-sm text-red-700" role="alert">{{ error() }}</p>
    }

    <div class="mt-6 flex gap-3">
      <button type="button" (click)="cancelar()" [disabled]="enviando()" class="inline-flex flex-1 items-center justify-center gap-2 rounded-md border border-ink-200 bg-white px-5 py-3 text-sm font-bold text-ink-800 transition-colors hover:border-brand-300 hover:bg-brand-50 disabled:opacity-45">
        Cancelar
      </button>
      <button
        type="button"
        (click)="enviar()"
        [disabled]="enviando() || calificacion() === 0"
        class="btn btn-primary flex-1"
      >
        {{ enviando() ? 'Publicando...' : 'Publicar reseña' }}
      </button>
    </div>
  </div>
</div>
