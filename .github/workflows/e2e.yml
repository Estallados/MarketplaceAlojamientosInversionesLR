name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SCRUM-205: flujo publicar → buscar → disponibilidad → cotizar → reservar en el navegador,
  # con el backend y el frontend reales y los usuarios de la demostración
  flujo-reserva:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El backend sube las fotos a Cloudinary; en el CI se usa un servidor que la imita
      - name: Arrancar Cloudinary falso
        run: nohup node e2e/cloudinary-falso.mjs > cloudinary.log 2>&1 &

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar el backend
        working-directory: marketplaceInversionesLRBack
        run: mvn -B -q package -Dmaven.test.skip=true

      - name: Arrancar el backend
        working-directory: marketplaceInversionesLRBack
        env:
          DB_URL: jdbc:postgresql://localhost:5432/marketplace
          DB_USERNAME: marketplace
          DB_PASSWORD: marketplace
          # Base vacía: Hibernate crea las tablas; DEMO_POBLAR crea las políticas, las tarifas y un usuario por rol
          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          DEMO_POBLAR: 'true'
          GEOCODING_HABILITADO: 'false'
          CLOUDINARY_URL: cloudinary://clave:secreto@e2e?upload_prefix=http://localhost:9000
          APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
        run: |
          export AES_SECRET_KEY=$(openssl rand -base64 32)
          nohup java -jar target/marketplaceInversionesLR-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && exit 0
            sleep 3
          done
          echo "El backend no arrancó"; tail -100 backend.log; exit 1

      - name: Construir y arrancar el frontend
        run: |
          docker build -t marketplace-front marketplaceInversionesLRFront
          docker run -d --name front -p 4200:80 -e API_URL=http://localhost:8081 marketplace-front
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200/ > /dev/null && exit 0
            sleep 2
          done
          echo "El frontend no arrancó"; docker logs front; exit 1

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.49.1
          npx playwright install --with-deps chromium

      - name: Pruebas E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Logs de los servicios
        if: always()
        run: docker logs front > front.log 2>&1 || true

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
            marketplaceInversionesLRBack/backend.log
            cloudinary.log
            front.log
