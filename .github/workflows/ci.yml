name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build y tests
        working-directory: marketplaceInversionesLRBack
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketplaceInversionesLRFront/package-lock.json
      - name: Instalar dependencias
        working-directory: marketplaceInversionesLRFront
        run: npm ci
      - name: Build
        working-directory: marketplaceInversionesLRFront
        run: npx ng build
      - name: Tests headless
        working-directory: marketplaceInversionesLRFront
        run: npx ng test --watch=false --browsers=ChromeHeadless

  sonar:
    # Los PRs desde forks no tienen acceso a los secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Análisis SonarCloud
        working-directory: marketplaceInversionesLRBack
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Estallados_MarketplaceAlojamientosInversionesLR
          -Dsonar.organization=estallados
          -Dsonar.host.url=https://sonarcloud.io
