  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    AlojamientoDTO:
      type: "object"
      properties:
        idAlojamiento:
          type: "integer"
          format: "int64"
        titulo:
          type: "string"
        descripcion:
          type: "string"
        ubicacion:
          type: "string"
        ciudad:
          type: "string"
        latitud:
          type: "number"
          format: "double"
        longitud:
          type: "number"
          format: "double"
        tipo:
          type: "string"
        capacidad:
          type: "integer"
          format: "int32"
        precioNoche:
          type: "number"
        porcentajeLimpieza:
          type: "number"
        porcentajeServicio:
          type: "number"
        reglas:
          type: "string"
        estado:
          type: "string"
          enum:
            - "BORRADOR"
            - "PENDIENTE_REVISION"
            - "ACTIVA"
            - "PAUSADA"
            - "BLOQUEADA"
        idAnfitrion:
          type: "integer"
          format: "int64"
        idPolitica:
          type: "integer"
          format: "int64"
        nombrePolitica:
          type: "string"
        fechaCreacion:
          type: "string"
          format: "date-time"
        amenidades:
          type: "array"
          items:
            type: "string"
        imagenes:
          type: "array"
          items:
            type: "string"
        serviciosAdicionales:
          type: "array"
          items:
            "$ref": "#/components/schemas/ServicioAdicionalDTO"
        habitaciones:
          type: "integer"
          format: "int32"
        camas:
          type: "integer"
          format: "int32"
        banos:
          type: "integer"
          format: "int32"
        horaEntrada:
          type: "string"
          format: "time"
        horaSalida:
          type: "string"
          format: "time"
        fechaActualizacion:
          type: "string"
          format: "date-time"
        detalleImagenes:
          type: "array"
          items:
            "$ref": "#/components/schemas/ImagenDTO"
        promedioCalificacion:
          type: "number"
          format: "double"
