openapi: 3.0.3
info:
  title: Alojamientos y publicaciones
  version: 0.1.0
  description: |
    Contrato del servicio S03 Alojamientos y publicaciones (ver `docs/services/lista-servicios.md`).
    Rutas, campos y códigos alineados con el borrador `marketplace-backend` (AlojamientoController).
    La búsqueda (`GET /alojamientos`, `/alojamientos/disponibles`, `/alojamientos/tipos`) está en
    `disponibilidad-busqueda.yaml` porque es de S05.

    | Requisito | HU | CA |
    |---|---|---|
    | RF-017 Crear publicación de alojamiento | HU-15 | CA-094, CA-097, CA-098 |
    | RF-018 Gestión y actualización de publicación | HU-16, HU-17 | CA-098, CA-100, CA-101, CA-104, CA-108, CA-185 |
    | RF-019 Consultar publicaciones registradas | HU-18, HU-19 | CA-093, CA-103 |
    | RF-027 Gestión del estado de revisión del alojamiento | HU-17 | CA-157, CA-159 |
    | RNF-004 Protección de operaciones | HU-16 | CA-113, CA-114 |
    | RNF-022 Visualización de ubicación del alojamiento | HU-18 | CA-164 |

    **Estados (CA-104):** BORRADOR, PENDIENTE_REVISION, ACTIVA, PAUSADA y BLOQUEADA. Aquí están
    las transiciones del anfitrión: enviar a revisión (CA-157), pausar (CA-108) y reanudar.
    Aprobar, rechazar, bloquear y desbloquear las hace el administrador en `/admin/alojamientos/...`
    y van en el contrato de administración (parte 2).

    **Permisos.** Crear, enviar a revisión, pausar y reanudar exigen el rol ANFITRION.
    Editar, imágenes y servicios adicionales exigen ser el anfitrión propietario o ADMIN (CA-113);
    cualquier otro recibe 403 (CA-101, CA-114).

    **Respuestas de error.** `{"message": "..."}` (esquema `Mensaje`), igual que en `identidad.yaml`.
servers:
  - url: /
    description: Raíz del backend, sin prefijo (en local, http://localhost:8081)
tags:
  - name: Publicaciones
    description: Crear, editar y consultar publicaciones
  - name: Estados
    description: Transiciones de estado que pide el anfitrión
  - name: Imágenes
    description: Imágenes de una publicación
  - name: Servicios adicionales
    description: Servicios adicionales con costo
paths:
  /alojamientos:
    post:
      tags: [Publicaciones]
      operationId: crearAlojamiento
      summary: Crear alojamiento en BORRADOR con sus imágenes (ANFITRION)
      description: |
        HU-15, RF-017. Queda en estado BORRADOR (CA-094). Se envía como multipart/form-data con
        `datos` (JSON del alojamiento; en el borrador solo el título es obligatorio) y `archivos`
        (de 1 a 15 imágenes JPG, PNG o WEBP de hasta 5 MB; la primera queda como principal).
        Capacidad y precio deben ser mayores que cero (CA-098).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, archivos]
              properties:
                datos:
                  $ref: '#/components/schemas/AlojamientoEntrada'
                archivos:
                  type: array
                  minItems: 1
                  maxItems: 15
                  items:
                    type: string
                    format: binary
            encoding:
              datos:
                contentType: application/json
      responses:
        '201':
          description: Alojamiento creado en BORRADOR con sus imágenes (CA-094)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '400':
          description: Título faltante, imágenes inválidas, capacidad o precio no positivos (CA-098) o política inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '413':
          description: El archivo supera el tamaño permitido (5 MB por imagen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '415':
          description: El cuerpo debe enviarse como multipart/form-data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '503':
          description: No se pudo guardar la imagen. Intenta de nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
  /alojamientos/politicas:
    get:
      tags: [Publicaciones]
      operationId: listarPoliticas
      summary: Políticas de cancelación disponibles (público)
      description: HU-15. Políticas que el anfitrión puede asignar al crear o editar la publicación.
      security: []
      responses:
        '200':
          description: Políticas de cancelación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoliticaCancelacion'
  /alojamientos/mios:
    get:
      tags: [Publicaciones]
      operationId: misAlojamientos
      summary: Mis alojamientos con su estado (ANFITRION)
      description: HU-19, RF-019. Solo las publicaciones del anfitrión del token, con su estado (CA-103).
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanio'
      responses:
        '200':
          description: Página de alojamientos del anfitrión (CA-103)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAlojamientos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /alojamientos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Publicaciones]
      operationId: detalleAlojamiento
      summary: Detalle de un alojamiento
      description: |
        HU-18, RF-019. Público si está ACTIVA (CA-093); en otro estado solo lo ven su anfitrión o un
        ADMIN (para los demás responde 404). Incluye imágenes, servicios, calificación, anfitrión y
        latitud y longitud para el mapa (CA-164).
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Alojamiento con imágenes, servicios, calificación y anfitrión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
    put:
      tags: [Publicaciones]
      operationId: actualizarAlojamiento
      summary: Editar alojamiento (propietario o ADMIN)
      description: |
        HU-16, RF-018. Guarda y devuelve la información actualizada (CA-100). Los campos en null no
        cambian; las amenidades enviadas reemplazan las anteriores. Las imágenes se gestionan con
        `/imagenes`. Capacidad y precio deben ser mayores que cero (CA-098).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlojamientoEntrada'
      responses:
        '200':
          description: Alojamiento actualizado (CA-100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '400':
          description: Capacidad o precio no positivos (CA-098), valores negativos o política inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
  /alojamientos/{id}/historial:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Estados]
      operationId: historialEstados
      summary: Historial de estados (propietario o ADMIN)
      description: HU-17. Cambios de estado del primero al último.
      responses:
        '200':
          description: Historial de estados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialEstado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
  /alojamientos/{id}/enviarrevision:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Estados]
      operationId: enviarRevision
      summary: 'Enviar a revisión: BORRADOR → PENDIENTE_REVISION (ANFITRION)'
      description: |
        HU-17, RF-027. Cambia a PENDIENTE_REVISION (CA-157); pasa a ACTIVA solo cuando un
        administrador la aprueba (HU-32). Si falta información mínima, incluida la política de
        cancelación, responde 409 indicando lo que falta (CA-097).
      responses:
        '200':
          description: Alojamiento en PENDIENTE_REVISION (CA-157)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
        '409':
          description: 'Faltan datos (CA-097), por ejemplo "Completa los datos antes de enviar a revisión. Falta: descripción, capacidad.", o la transición no está permitida (CA-104)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
  /alojamientos/{id}/pausar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Estados]
      operationId: pausar
      summary: 'Pausar: ACTIVA → PAUSADA (ANFITRION)'
      description: HU-17, RF-018. Una publicación PAUSADA no recibe reservas nuevas ni aparece disponible (CA-108, CA-159).
      responses:
        '200':
          description: Alojamiento en PAUSADA (CA-108)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
        '409':
          $ref: '#/components/responses/TransicionNoPermitida'
  /alojamientos/{id}/reanudar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Estados]
      operationId: reanudar
      summary: 'Reanudar: PAUSADA → ACTIVA (ANFITRION)'
      description: HU-17. Una publicación BLOQUEADA no se puede reanudar.
      responses:
        '200':
          description: Alojamiento en ACTIVA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alojamiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
        '409':
          $ref: '#/components/responses/TransicionNoPermitida'
  /alojamientos/{id}/imagenes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Imágenes]
      operationId: subirImagenes
      summary: Subir imágenes (propietario o ADMIN)
      description: HU-16. JPG, PNG o WEBP de hasta 5 MB; máximo 15 por alojamiento.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivos]
              properties:
                archivos:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Todas las imágenes del alojamiento, la principal primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Imagen'
        '400':
          description: Sin imágenes, más de 15 o formato no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
        '413':
          description: El archivo supera el tamaño permitido (5 MB por imagen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
  /alojamientos/{id}/imagenes/{idImagen}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdImagen'
    delete:
      tags: [Imágenes]
      operationId: eliminarImagen
      summary: Eliminar una imagen (propietario o ADMIN)
      description: HU-16. Si era la principal, la siguiente pasa a serlo. Debe quedar al menos una imagen.
      responses:
        '200':
          description: Imágenes restantes, la principal primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Imagen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
        '409':
          description: El alojamiento debe conservar al menos una imagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
  /alojamientos/{id}/imagenes/{idImagen}/principal:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdImagen'
    patch:
      tags: [Imágenes]
      operationId: marcarImagenPrincipal
      summary: Marcar una imagen como principal (propietario o ADMIN)
      description: HU-16.
      responses:
        '200':
          description: Imágenes, la principal primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Imagen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
  /alojamientos/{id}/servicios:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Servicios adicionales]
      operationId: agregarServicio
      summary: Agregar servicio adicional con costo (propietario o ADMIN)
      description: |
        HU-16, RF-018, CA-185. Nombre y costo positivo. Aplica a nuevas cotizaciones y no altera
        las reservas ya confirmadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioAdicionalEntrada'
      responses:
        '201':
          description: Servicio adicional creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicioAdicional'
        '400':
          $ref: '#/components/responses/ServicioInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          $ref: '#/components/responses/AlojamientoNoEncontrado'
  /alojamientos/{id}/servicios/{idServicio}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: idServicio
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Servicios adicionales]
      operationId: actualizarServicio
      summary: Modificar servicio adicional (propietario o ADMIN)
      description: HU-16, CA-185. Si no es propietario ni ADMIN, 403 (CA-101).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioAdicionalEntrada'
      responses:
        '200':
          description: Servicio adicional actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicioAdicional'
        '400':
          $ref: '#/components/responses/ServicioInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          description: El alojamiento o el servicio adicional no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
    delete:
      tags: [Servicios adicionales]
      operationId: eliminarServicio
      summary: Eliminar servicio adicional (propietario o ADMIN)
      description: HU-16, CA-185. Si no es propietario ni ADMIN, 403 (CA-101).
      responses:
        '200':
          description: Servicio adicional eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoPropietario'
        '404':
          description: El alojamiento o el servicio adicional no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token entregado por /auth/login (ver identidad.yaml).
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador del alojamiento
      schema:
        type: integer
        format: int64
    IdImagen:
      name: idImagen
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, desde 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamanio:
      name: tamanio
      in: query
      required: false
      description: Elementos por página (máximo 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    NoAutenticado:
      description: 'No autenticado: token ausente, inválido o expirado (CA-134)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    SinPermiso:
      description: No tienes permisos para esta operación (rol no permitido, CA-131)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    NoPropietario:
      description: Solo el anfitrión propietario o un administrador puede modificar este alojamiento (CA-101, CA-114)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    AlojamientoNoEncontrado:
      description: El alojamiento no existe o no es visible para el usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    TransicionNoPermitida:
      description: El estado actual no permite la transición, por ejemplo "No se puede pasar de BORRADOR a PAUSADA." (CA-104)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    ServicioInvalido:
      description: El servicio adicional necesita un nombre y un costo positivo. (CA-185)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
  schemas:
    EstadoAlojamiento:
      type: string
      description: Estados permitidos (CA-104)
      enum: [BORRADOR, PENDIENTE_REVISION, ACTIVA, PAUSADA, BLOQUEADA]
    AlojamientoEntrada:
      type: object
      description: |
        Datos del alojamiento (CA-094). En el borrador solo el título es obligatorio; la
        información mínima completa se exige al enviarlo a revisión (CA-097).
      required: [titulo]
      properties:
        titulo:
          type: string
          minLength: 1
        descripcion:
          type: string
        ubicacion:
          type: string
          description: Dirección
        ciudad:
          type: string
        latitud:
          type: number
          format: double
          description: Para el mapa (CA-164)
        longitud:
          type: number
          format: double
          description: Para el mapa (CA-164)
        tipo:
          type: string
          description: Tipo de alojamiento, por ejemplo Apartamento o Casa
        capacidad:
          type: integer
          minimum: 1
          description: Mayor que cero (CA-098)
        precioNoche:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Mayor que cero (CA-098)
        habitaciones:
          type: integer
          minimum: 0
        camas:
          type: integer
          minimum: 0
        banos:
          type: integer
          minimum: 0
        horaEntrada:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
          description: Formato HH:mm
        horaSalida:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
          description: Formato HH:mm
        reglas:
          type: string
        amenidades:
          type: array
          uniqueItems: true
          description: Servicios incluidos, por ejemplo wifi o piscina. Al editar reemplazan los anteriores.
          items:
            type: string
        idPolitica:
          type: integer
          format: int64
          description: Política de cancelación (ver /alojamientos/politicas); obligatoria para enviar a revisión
        porcentajeLimpieza:
          type: number
          description: Tarifa de limpieza en porcentaje (RF-023, HU-24)
        porcentajeServicio:
          type: number
          description: Tarifa de servicio en porcentaje (RF-023, HU-24)
    Alojamiento:
      allOf:
        - $ref: '#/components/schemas/AlojamientoEntrada'
        - type: object
          required: [idAlojamiento, estado, idAnfitrion]
          properties:
            idAlojamiento:
              type: integer
              format: int64
            estado:
              $ref: '#/components/schemas/EstadoAlojamiento'
            idAnfitrion:
              type: integer
              format: int64
            nombreAnfitrion:
              type: string
            correoAnfitrion:
              type: string
            nombrePolitica:
              type: string
            imagenes:
              type: array
              description: URLs de las imágenes, la principal primero
              items:
                type: string
            detalleImagenes:
              type: array
              items:
                $ref: '#/components/schemas/Imagen'
            serviciosAdicionales:
              type: array
              items:
                $ref: '#/components/schemas/ServicioAdicional'
            promedioCalificacion:
              type: number
              format: double
            cantidadResenas:
              type: integer
              format: int64
            cantidadReservas:
              type: integer
              format: int64
            fechaCreacion:
              type: string
              format: date-time
            fechaActualizacion:
              type: string
              format: date-time
    PaginaAlojamientos:
      type: object
      required: [contenido, pagina, tamanio, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Alojamiento'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    Imagen:
      type: object
      required: [idImagen, url, principal]
      properties:
        idImagen:
          type: integer
          format: int64
        url:
          type: string
        idAlojamiento:
          type: integer
          format: int64
        principal:
          type: boolean
    PoliticaCancelacion:
      type: object
      required: [idPolitica, nombre]
      properties:
        idPolitica:
          type: integer
          format: int64
        nombre:
          type: string
        condiciones:
          type: string
        diasReembolsoTotal:
          type: integer
        diasReembolsoParcial:
          type: integer
        porcentajeParcial:
          type: integer
    HistorialEstado:
      type: object
      required: [idHistorial, estadoNuevo, fecha]
      properties:
        idHistorial:
          type: integer
          format: int64
        idAlojamiento:
          type: integer
          format: int64
        estadoAnterior:
          $ref: '#/components/schemas/EstadoAlojamiento'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoAlojamiento'
        motivo:
          type: string
        idUsuario:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
    ServicioAdicionalEntrada:
