spring.application.name=marketplace

server.port=8081


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Máximo de espera por una conexión libre (por defecto 30 s). Con el servidor saturado conviene fallar rápido
# con un 503 en lugar de acumular peticiones que el cliente ya abandonó. Deja margen para que Neon despierte.
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
# Oculta el bloque "Database info" (URL de Neon, versión, pool) que Hibernate imprime al arrancar
logging.level.org.hibernate.orm.connections.pooling=WARN
# Las colecciones y relaciones perezosas (amenidades, alojamiento de una reserva...) se cargan de a 100 por
# consulta en lugar de una consulta por elemento al recorrer una página
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Valor por defecto de Spring Boot, declarado para que quede explícito: la sesión de JPA vive toda la petición
spring.jpa.open-in-view=true

# --- Respuestas comprimidas: un listado de alojamientos pasa de ~80 KB a ~7 KB con gzip ---
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# --- CORS: orígenes del front que pueden llamar al back (REST y WebSocket) ---
# El front desplegado en Render y el front local. APP_CORS_ALLOWED_ORIGINS los reemplaza
# (separados por coma) sin tocar el código.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://marketplacealojamientosinversioneslr-2.onrender.com,http://localhost:4200}

spring.jwt.secret=${AES_SECRET_KEY}
spring.jwt.expirationtime=3600000

# --- Correo por el SMTP de Brevo (puerto 2525 con STARTTLS) ---
# MAIL_USERNAME: login SMTP de Brevo (xxx@smtp-brevo.com); MAIL_PASSWORD: clave SMTP de Brevo.
# MAIL_FROM: remitente verificado en Brevo; es el "From" de todos los correos (CorreoUtil).
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
correo.remitente=${MAIL_FROM:}
management.health.mail.enabled=false

# --- Límite de intentos fallidos de inicio de sesión (LimitadorIntentosLogin): cada intento cuesta CPU por
# BCrypt. Superado el límite, POST /auth/login responde 429 con Retry-After antes de verificar la contraseña ---
app.login.limite.habilitado=${LOGIN_LIMITE_HABILITADO:true}
app.login.limite.fallos-por-cuenta=5
app.login.limite.minutos-cuenta=15
app.login.limite.fallos-por-ip=30
app.login.limite.minutos-ip=1
# Detrás del proxy de Render, la IP del cliente viene en X-Forwarded-For (Tomcat solo la acepta de proxies internos)
server.forward-headers-strategy=native

# --- Administrador inicial ---
app.admin.email=${ADMIN_EMAIL:admin@marketplace.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=Administrador

springdoc.swagger-ui.path=/swagger-ui.html



# --- Inicio de sesión con Google: client ID de OAuth (tipo "Aplicación web") del proyecto
# proyecto-software-513202 en Google Cloud. No es secreto: es el mismo que usa el botón del front
# (lo entrega GET /auth/google/configuracion). GOOGLE_CLIENT_ID lo reemplaza; vacío, /auth/google responde 503.
# El client secret NO se usa en este flujo y nunca debe ir aquí ---
app.google.client-id=${GOOGLE_CLIENT_ID:928256385399-h2jla557omaf728jmijqqrul1sbb26td.apps.googleusercontent.com}

# --- Pagos con Stripe en modo prueba: claves sk_test_ / pk_test_ del dashboard de Stripe (modo prueba).
# Sin STRIPE_SECRET_KEY los pagos usan el simulador local con los mismos métodos de prueba ---
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# --- Datos de demostración (DatosDemoInicializador): DEMO_POBLAR=true los carga una sola vez ---
app.demo.poblar=${DEMO_POBLAR:false}

# --- Imágenes subidas: se guardan en Cloudinary (CloudinaryService). CLOUDINARY_URL tiene la forma
# cloudinary://<api_key>:<api_secret>@<cloud_name>; sin ella subir imágenes responde 503.
# CLOUDINARY_CARPETA separa ambientes dentro de la misma cuenta ---
app.cloudinary.carpeta=${CLOUDINARY_CARPETA:marketplace}
# Migración de un solo uso de la antigua tabla imagen a Cloudinary (MigracionImagenesInicializador)
app.imagenes.migrar=${MIGRAR_IMAGENES:false}
# 5 MB por imagen; una petición puede traer hasta 15 imágenes (PublicacionService.MAXIMO_IMAGENES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# --- Ubicación en el mapa (GeocodingService): al crear o editar un alojamiento sin coordenadas, se
# buscan la dirección y la ciudad en Nominatim (OpenStreetMap). Sin clave; máximo 1 petición por segundo.
# GEOCODING_HABILITADO=false lo apaga (el alojamiento se guarda sin coordenadas) ---
app.geocoding.habilitado=${GEOCODING_HABILITADO:true}
app.geocoding.url=https://nominatim.openstreetmap.org/search
app.geocoding.agente=MarketplaceAlojamientos/1.0 (proyecto academico Universidad El Bosque)
