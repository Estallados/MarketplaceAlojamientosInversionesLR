spring.application.name=marketplace

# Configuración solo para las pruebas. La base de datos es un PostgreSQL temporal
# en Docker (ver ContenedorPostgres): Spring toma la conexión del contenedor y
# Hibernate crea las tablas al iniciar y las borra al terminar.
# AES_SECRET_KEY de pruebas la define el maven-surefire-plugin en el pom.xml.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jwt.expirationtime=3600000

# Sin servidor de correo real: las pruebas reemplazan el JavaMailSender
spring.mail.host=localhost
spring.mail.username=pruebas@marketplace.local
# Igual que en ejecución: el correo no participa en el chequeo de salud. Además, con el
# JavaMailSender simulado, ese chequeo no encuentra servidor y no deja arrancar el contexto.
management.health.mail.enabled=false

app.cors.allowed-origins=http://localhost:4200
