spring.application.name=marketplace

# Configuración solo para las pruebas. La base de datos es un PostgreSQL temporal
# en Docker (ver ContenedorPostgres): Spring toma la conexión del contenedor y
# Hibernate crea las tablas al iniciar y las borra al terminar.
# AES_SECRET_KEY de pruebas la define el maven-surefire-plugin en el pom.xml.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jwt.expirationtime=3600000

# Sin servidor de correo real: las pruebas reemplazan el JavaMailSender
spring.mail.host=localhost
spring.mail.username=pruebas@marketplace.local
# Igual que en ejecución: el correo no participa en el chequeo de salud. Además, con el
# JavaMailSender simulado, ese chequeo no encuentra servidor y no deja arrancar el contexto.
management.health.mail.enabled=false

app.cors.allowed-origins=http://localhost:4200


# --- Imágenes subidas: se guardan en Cloudinary (CloudinaryService). CLOUDINARY_URL tiene la forma
# cloudinary://<api_key>:<api_secret>@<cloud_name>; sin ella subir imágenes responde 503.
# CLOUDINARY_CARPETA separa ambientes dentro de la misma cuenta ---
app.cloudinary.carpeta=${CLOUDINARY_CARPETA:marketplace}

# 5 MB por imagen; una petición puede traer hasta 15 imágenes (PublicacionService.MAXIMO_IMAGENES)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# --- Ubicación en el mapa (GeocodingService): al crear o editar un alojamiento sin coordenadas, se
# buscan la dirección y la ciudad en Nominatim (OpenStreetMap). Sin clave; máximo 1 petición por segundo.
# GEOCODING_HABILITADO=false lo apaga (el alojamiento se guarda sin coordenadas) ---
app.geocoding.habilitado=${GEOCODING_HABILITADO:true}
app.geocoding.url=https://nominatim.openstreetmap.org/search
app.geocoding.agente=MarketplaceAlojamientos/1.0 (proyecto academico Universidad El Bosque)


# --- Inicio de sesión con Google: client ID de OAuth (tipo "Aplicación web") del proyecto
# proyecto-software-513202 en Google Cloud. No es secreto: es el mismo que usa el botón del front
# (lo entrega GET /auth/google/configuracion). GOOGLE_CLIENT_ID lo reemplaza; vacío, /auth/google responde 503.
# El client secret NO se usa en este flujo y nunca debe ir aquí ---
app.google.client-id=${GOOGLE_CLIENT_ID:928256385399-h2jla557omaf728jmijqqrul1sbb26td.apps.googleusercontent.com}